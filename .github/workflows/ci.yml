name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: README test count matches what vitest collects
        run: |
          # `vitest list` collects without running, and unlike the run summary it
          # carries no ANSI colour for the count to hide behind. Parsing the summary
          # worked locally and found nothing in CI, where colour stays on.
          n=$(npx vitest list | grep -c ' > ')
          [ "$n" -gt 0 ] || { echo "vitest listed no tests"; exit 1; }
          fail=0
          grep -q "badge/tests-$n-brightgreen" README.md || { echo "badge does not say $n"; fail=1; }
          grep -q 'alt="'"$n"' tests"' README.md || { echo "badge alt text does not say $n"; fail=1; }
          [ "$fail" = 0 ] || { echo "vitest collects $n. Update both spots in README.md."; exit 1; }
          echo "README agrees with vitest: $n"

      - name: Build (includes typecheck)
        run: npm run build
        env:
          # The build doesn't need a real key; route handlers read this at request time, not at build.
          # Keeping a dummy here prevents accidental failures if a future change pulls the env at module scope.
          ANTHROPIC_API_KEY: dummy-key-for-build-only
