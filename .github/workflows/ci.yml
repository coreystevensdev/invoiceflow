name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: README test count matches what vitest collects
        run: |
          # The JSON reporter, not `vitest list`. list was chosen because the run
          # summary carries ANSI colour the count hides behind, which is true, but it
          # counts collected entries rather than executed tests. Under vitest 5 an
          # it.each is listed once as its unexpanded "%s" template instead of once per
          # case, so the three loader-failure cases in pdf.test.ts became one entry and
          # the count read 132 while the suite still ran 134. JSON has no colour to
          # strip and numTotalTests is what actually executed.
          npx vitest run --reporter=json --outputFile=/tmp/vitest-results.json >/dev/null 2>&1 || true
          n=$(node -p "require('/tmp/vitest-results.json').numTotalTests")
          [ "$n" -gt 0 ] || { echo "vitest ran no tests"; exit 1; }
          fail=0
          grep -q "badge/tests-$n-brightgreen" README.md || { echo "badge does not say $n"; fail=1; }
          grep -q 'alt="'"$n"' tests"' README.md || { echo "badge alt text does not say $n"; fail=1; }
          [ "$fail" = 0 ] || { echo "vitest collects $n. Update both spots in README.md."; exit 1; }
          echo "README agrees with vitest: $n"

      - name: Build (includes typecheck)
        run: npm run build
        env:
          # The build doesn't need a real key; route handlers read this at request time, not at build.
          # Keeping a dummy here prevents accidental failures if a future change pulls the env at module scope.
          ANTHROPIC_API_KEY: dummy-key-for-build-only
